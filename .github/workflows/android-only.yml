name: Android APK (only)

# Lightweight build for forks: Android only, no desktop matrix, no release step.
# Builds a Release APK (app id org.vita3k.emulator). Uses your KEYSTORE secrets if set, otherwise a generated key.
on:
  workflow_dispatch:
  push:
    branches: [ fake-psn-account ]

env:
  BUILD_CONFIG: Release

jobs:
  android-build:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: cache-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            cache-android-native-

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/setup-android.sh

      - uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Prepare signing key (your secrets, or a generated one)
        env:
          KEYSTORE_ENCODED: ${{ secrets.KEYSTORE }}
          S_STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_ENCODED" ]; then
            echo "$KEYSTORE_ENCODED" | base64 --decode > /home/runner/keystore.jks
            echo "SIGNING_STORE_PASSWORD=$S_STORE_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$S_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$S_KEY_PASS" >> "$GITHUB_ENV"
          else
            # No secrets: generate a throwaway key so a real Release APK is built.
            # NOTE: a new key every run means you must uninstall the old APK before updating.
            keytool -genkeypair -v -keystore /home/runner/keystore.jks -storetype PKCS12 \
              -alias vita3k -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vita3kbuild -keypass vita3kbuild -dname "CN=Vita3K fork build"
            echo "SIGNING_STORE_PASSWORD=vita3kbuild" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=vita3k" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=vita3kbuild" >> "$GITHUB_ENV"
          fi

      - name: Compute artifact paths
        shell: bash
        run: |
          echo "ARTIFACT_NAME=vita3k-$(git rev-parse --short HEAD)-android" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=artifacts/vita3k-$(git rev-parse --short HEAD)-android" >> "$GITHUB_ENV"

      - name: Build Android target (Release)
        env:
          SIGNING_STORE_PATH: /home/runner/keystore.jks
          VCPKG_ROOT: /usr/local/share/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash ./.ci/build-android.sh "${{ env.ARTIFACT_DIR }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
